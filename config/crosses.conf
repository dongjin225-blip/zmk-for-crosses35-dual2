# Uncomment the following line to enable OLED Displays
# CONFIG_ZMK_DISPLAY=y

# Report battery for both sides of the keyboard
CONFIG_BT_BAS=y

# Mouse / trackball BLE report queue.
# 끊김이 계속 있으면 12보다 20이 안정적임.
# 단점은 순간적으로 BLE가 밀렸을 때 약간 따라오는 느낌이 생길 수 있음.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=20

# ZMK BLE experimental features.
# 현재는 연결 안정성 쪽 설정, 특히 2M PHY 비활성화 쪽을 포함함.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# BLE 송신 출력 +8 dBm.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 자동 출력 조절 끄고 고출력 쪽으로 고정.
# 단점: 배터리 더 빨리 닳을 수 있음.
CONFIG_BT_CTLR_CONN_RSSI=n
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=n

# 2M PHY 비활성화.
# 거리/간섭 환경에서는 1M PHY가 더 안정적인 경우가 많음.
CONFIG_BT_CTLR_PHY_2M=n

# BLE 연결 interval / latency.
# 6 = 7.5ms 근처의 낮은 interval.
# LATENCY=0은 연결 이벤트를 덜 건너뛰게 해서 트랙볼 끊김/지연 완화 목적.
# 단점: 배터리 소모 증가.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Windows battery notification workaround
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Passkey off
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

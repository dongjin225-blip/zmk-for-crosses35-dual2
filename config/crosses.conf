# Uncomment the following line to enable OLED Displays
# CONFIG_ZMK_DISPLAY=y

# Report battery for both sides of the keyboard
CONFIG_BT_BAS=y

# BLE stability / latency tuning
#
# 마우스 리포트 큐.
# 1은 너무 작아서 BLE가 잠깐 막힐 때 트랙볼 이동값이 드랍될 수 있음.
# ZMK 기본값은 20이라 일단 20으로 복구.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=12

# ZMK BLE experimental features.
# 공식 설명상 연결 안정성 개선 설정을 포함하고, experimental conn은 2M PHY를 끄는 쪽임.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# 송신 출력 +8 dBm.
# 거리가 조금만 멀어져도 끊기면 이건 유지하는 게 맞음.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# RSSI 기반 TX power 제어.
# 일단 유지. 만약 이것도 의심되면 나중에 n으로 빼고 비교.
CONFIG_BT_CTLR_CONN_RSSI=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# 거리 안정성 우선.
# 2M PHY는 가까운 거리 처리량에는 유리할 수 있지만,
# 벽/거리/간섭에는 1M 쪽이 더 안정적인 경우가 많음.
CONFIG_BT_CTLR_PHY_2M=n

# 낮은 지연 연결 interval.
# 너무 올리면 트랙볼 지연이 느껴질 수 있어서 일단 기존값 유지.
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Windows battery notification bug workaround
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Passkey off
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

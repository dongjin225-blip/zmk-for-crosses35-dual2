# Uncomment the following line to enable OLED Displays
# CONFIG_ZMK_DISPLAY=y

# Report battery for both sides of the keyboard
CONFIG_BT_BAS=y

# Mouse / trackball BLE report queue.
# 작게 하면 반응은 빠르지만 순간 드랍/끊김이 늘 수 있음.
# 크게 하면 끊김은 줄지만 살짝 밀리는 느낌이 생길 수 있음.
# 8은 끊김이 있었고, 20은 살짝 밀렸으니 12부터 테스트.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=12

# ZMK BLE experimental features.
# 연결 안정성 개선 쪽 설정을 포함함.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# BLE 송신 출력 +8 dBm.
# 펌웨어에서 할 수 있는 고출력 설정에 가까움.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# RSSI 기반 자동 출력 조절 비활성화.
# 가까운 거리에서도 출력 낮추지 않고 고출력 쪽으로 고정 테스트.
# 단점: 배터리 더 빨리 닳을 수 있음.
CONFIG_BT_CTLR_CONN_RSSI=n
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=n

# 2M PHY 비활성화.
# 2M은 가까운 거리 처리량은 좋을 수 있지만,
# 거리/간섭 환경에서는 1M 쪽이 더 안정적인 경우가 많음.
CONFIG_BT_CTLR_PHY_2M=n

# BLE 연결 interval.
# 낮을수록 지연은 줄지만 전력 소모가 늘 수 있음.
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Windows battery notification workaround
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Passkey off
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
